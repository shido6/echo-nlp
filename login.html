<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greg — Beta sign in</title>
<meta name="description" content="Greg — NLP observability for voice infrastructure. Beta sign in.">
<style>
  :root {
    --bg: #0a0e14;
    --bg-soft: #10161f;
    --panel: #141c28;
    --line: #243042;
    --ink: #e8eef6;
    --muted: #8b98ab;
    --accent: #38bdf8;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    padding: 24px;
  }
  .gate {
    width: 100%;
    max-width: 460px;
    text-align: center;
    padding: 44px 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  }
  .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 30px; margin-bottom: 22px; }
  .wave i {
    width: 4px; border-radius: 2px; background: var(--accent);
    animation: bar 1.1s ease-in-out infinite;
  }
  .wave i:nth-child(3n) { animation-delay: 0.15s; }
  .wave i:nth-child(3n+1) { animation-delay: 0.3s; }
  @keyframes bar { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .brand span { color: var(--accent); }
  .badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 20px;
  }
  p { color: var(--muted); margin: 0 0 20px; }
  form { margin: 0 0 20px; text-align: left; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }
  input {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 15px;
    margin: 0 0 16px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .error { color: var(--error); font-size: 14px; margin: -6px 0 14px; }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 30px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #04121d; }
  .btn-primary:hover { background: #7dd3fc; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .divider { color: var(--muted); font-size: 14px; margin: 22px 0 16px; }
  .back { display: block; margin-top: 24px; color: var(--muted); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="gate">
    <div class="wave" aria-hidden="true">
      <i style="height:40%"></i><i style="height:75%"></i><i style="height:100%"></i><i style="height:55%"></i><i style="height:85%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:60%"></i><i style="height:70%"></i>
    </div>
    <h1 class="brand">Greg<span>.</span></h1>
    <p class="badge">Beta sign in</p>
    <p>Ask your phone system in plain words. See check-ins, calls, and problems in seconds.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="err" hidden></p>
      <button class="btn btn-primary" id="signinBtn" type="submit">Sign in</button>
    </form>
    <p class="divider">The beta is invite-only. Don't have a login yet?</p>
    <a class="btn btn-primary" style="background:var(--bg-soft);color:var(--ink);border:1px solid var(--line);"
       href="mailto:kaiel@echoguard.ca?subject=Greg%20Beta%20Access">Email within</a>
    <a class="back" href="index.html">&larr; Back to Greg</a>
  </div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("loginForm");
  var err = document.getElementById("err");
  var btn = document.getElementById("signinBtn");
  var next = new URLSearchParams(location.search).get("next") || "/app.html";
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = "Signing in…";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (res.ok && res.d.ok) {
        location.href = next;
        return;
      }
      err.textContent = (res.d && res.d.error) || "That didn't work. Try again.";
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = "Sign in";
    }).catch(function () {
      err.textContent = "Something went wrong. Please try again.";
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = "Sign in";
    });
  });
})();
</script>
</body>
</html>
